name: Swift

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull request runs are cancelled; every push to main finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swift:
    name: Package, Showcase and copy-paste
    # Xcode and iOS Simulator runtimes: images/macos/macos-26-arm64-Readme.md in actions/runner-images.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # .xcode-version matches local development; the Makefile's default
      # destination (iPhone 17 Pro, iOS 26.2) ships with it on the image.
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app"
          xcodebuild -version
          xcrun simctl list devices available 'iPhone 17 Pro'

      - name: Lint Swift formatting
        run: make lint-swift

      - name: Test package
        run: make test-swift

      - name: Build and test Showcase
        run: make test-showcase

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Standalone copy-paste check
        run: make standalone

      # xcodebuild runs with -quiet, so record what actually ran.
      - name: Summarize test results
        if: always()
        run: |
          for result in .build/xcode/Logs/Test/*.xcresult; do
            [ -e "$result" ] || continue
            xcrun xcresulttool get test-results summary --path "$result" --compact |
              jq -r --arg name "$(basename "$result" .xcresult)" \
                '"\($name): \(.result), \(.passedTests) passed, \(.failedTests) failed, \(.skippedTests) skipped"' |
              tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcresult
          path: .build/xcode/Logs/Test/*.xcresult
          retention-days: 14
          if-no-files-found: ignore
