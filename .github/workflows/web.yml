name: Website & registry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull request runs are cancelled; every push to main finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Registry and website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Schema, metadata, source references, preview media and source hashes.
      # Possibly stale previews are annotations, not failures.
      - name: Validate registry
        run: npm run registry:check

      - name: Test registry tooling
        run: npm run test:scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build website
        run: npm run build:web

      - name: Check preview media in the build
        run: test -n "$(find apps/web/out/previews -name '*.mp4' -print -quit)"
